<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" font-family="Inter, sans-serif">
  <rect x="0" y="0" width="680" height="660" fill="#FFFFFF"/>

  <!-- ===== Top bar ===== -->
  <rect x="0" y="0" width="680" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="680" y2="56" stroke="#DCDFE4" stroke-width="1"/>
  <text x="16" y="33" font-size="14" font-weight="600" fill="#272B32">mekari </text>
  <text x="62" y="33" font-size="14" font-weight="600" fill="#E0001B">talenta</text>
  <circle cx="560" cy="28" r="9" fill="none" stroke="#656F80" stroke-width="1.4"/>
  <circle cx="600" cy="28" r="9" fill="none" stroke="#656F80" stroke-width="1.4"/>
  <circle cx="640" cy="28" r="12" fill="#D6DBF7"/>

  <!-- ===== Nav rail ===== -->
  <rect x="0" y="56" width="150" height="604" fill="#F1F5F9"/>
  <line x1="150" y1="56" x2="150" y2="660" stroke="#DCDFE4" stroke-width="1"/>
  <text x="16" y="96" font-size="12" fill="#656F80">Dashboard</text>
  <text x="16" y="124" font-size="12" fill="#656F80">Reviews</text>
  <text x="16" y="152" font-size="12" fill="#656F80">Goals</text>
  <text x="16" y="180" font-size="12" fill="#656F80">Competency</text>
  <rect x="0" y="194" width="150" height="30" fill="#D6DBF7"/>
  <text x="16" y="214" font-size="12" font-weight="600" fill="#4B61DC">Succession</text>

  <!-- ===== Page header ===== -->
  <rect x="150" y="56" width="530" height="92" fill="#F1F5F9"/>
  <text x="174" y="88" font-size="12" fill="#656F80">Succession plan / Create</text>
  <text x="174" y="122" font-size="24" font-weight="600" fill="#272B32">Create succession plan</text>

  <!-- ===== Stepper (full width, Pixel component as-is) ===== -->
  <circle cx="200" cy="178" r="11" fill="#4B61DC"/>
  <text x="196" y="182" font-size="11" fill="#FFFFFF">✓</text>
  <text x="218" y="182" font-size="12" fill="#272B32">Plan details</text>
  <line x1="300" y1="178" x2="360" y2="178" stroke="#DCDFE4" stroke-width="2"/>
  <circle cx="372" cy="178" r="11" fill="#4B61DC"/>
  <text x="368" y="182" font-size="11" fill="#FFFFFF">2</text>
  <text x="390" y="182" font-size="12" font-weight="600" fill="#4B61DC">Competency criteria</text>
  <line x1="510" y1="178" x2="560" y2="178" stroke="#DCDFE4" stroke-width="2"/>
  <circle cx="572" cy="178" r="11" fill="none" stroke="#DCDFE4" stroke-width="1.5"/>
  <text x="568" y="182" font-size="11" fill="#656F80">3</text>
  <text x="590" y="182" font-size="12" fill="#656F80">Review</text>

  <!-- assumption banner -->
  <rect x="174" y="200" width="466" height="30" rx="6" fill="#FFF8E1" stroke="#956400" stroke-dasharray="3 3"/>
  <text x="184" y="219" font-size="10.5" fill="#956400">ASSUMED LAYOUT — no current-UI reference for existing Step 2. For design to validate.</text>

  <!-- ===== Content — Step 2 form ===== -->
  <!-- Read-only position context -->
  <text x="174" y="262" font-size="14" font-weight="600" fill="#272B32">Job position</text>
  <rect x="174" y="272" width="380" height="40" rx="6" fill="#F1F5F9" stroke="#DCDFE4"/>
  <text x="186" y="297" font-size="13" fill="#656F80">Product Manager  (from Step 1, read-only)</text>

  <!-- Adaptive attribute picker (NEW behaviour) -->
  <rect x="166" y="328" width="396" height="116" rx="6" fill="#FFFFFF" stroke="#4B61DC" stroke-dasharray="4 3"/>
  <text x="174" y="348" font-size="11" font-weight="600" fill="#4B61DC">ADAPTS TO ASSIGNMENT SCOPING</text>
  <text x="174" y="372" font-size="14" font-weight="600" fill="#272B32">Job level</text>
  <text x="231" y="372" font-size="12" fill="#656F80">(label switches: Grade / Class / Job level)</text>
  <rect x="174" y="382" width="380" height="40" rx="6" fill="#FFFFFF" stroke="#DCDFE4"/>
  <text x="186" y="407" font-size="13" fill="#656F80">Select job level</text>
  <text x="540" y="407" font-size="13" fill="#656F80">▾</text>
  <text x="174" y="437" font-size="11" fill="#656F80">Picker dimension follows the linked assignment's scoping attribute.</text>

  <!-- Notice variant: no assignment -->
  <rect x="174" y="458" width="380" height="48" rx="6" fill="#F1F5F9" stroke="#DCDFE4"/>
  <circle cx="192" cy="482" r="7" fill="none" stroke="#656F80" stroke-width="1.3"/>
  <text x="189" y="486" font-size="10" fill="#656F80">i</text>
  <text x="210" y="478" font-size="11.5" fill="#272B32">If no competency assignment exists for this position:</text>
  <text x="210" y="494" font-size="11.5" fill="#656F80">no target picker shown — informational notice instead.</text>

  <!-- Divider + criteria area placeholder -->
  <line x1="174" y1="528" x2="554" y2="528" stroke="#DCDFE4" stroke-width="1"/>
  <text x="174" y="556" font-size="16" font-weight="600" fill="#272B32">Competency criteria</text>
  <rect x="174" y="568" width="380" height="44" rx="6" fill="#F1F5F9"/>
  <text x="186" y="595" font-size="12" fill="#656F80">Target competencies resolved from the matched assignment.</text>

  <!-- footer: Back / Next -->
  <line x1="150" y1="624" x2="680" y2="624" stroke="#DCDFE4" stroke-width="1"/>
  <text x="430" y="648" font-size="13" fill="#4B61DC">Back</text>
  <rect x="478" y="632" width="80" height="34" rx="6" fill="#4B61DC"/>
  <text x="502" y="654" font-size="13" font-weight="600" fill="#FFFFFF">Next</text>
</svg>
